<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up · API Monitor</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="auth-page" data-auth-mode="signup">
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Endpoint monitoring</p>
        <h1>Create your account</h1>
        <p class="muted auth-intro">Start monitoring HTTP endpoints in minutes.</p>
        <form id="auth-form" class="auth-form">
          <label>
            Username
            <input
              name="username"
              autocomplete="username"
              minlength="3"
              maxlength="100"
              pattern="[A-Za-z0-9_.-]+"
              title="Use letters, numbers, dots, dashes, or underscores"
              required
              autofocus
            />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
          </label>
          <label>
            Confirm password
            <input name="confirm_password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required />
          </label>
          <p id="auth-error" class="banner error hidden"></p>
          <button type="submit" class="primary auth-submit">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
      </section>
    </main>
    <script src="/static/auth.js"></script>
  </body>
</html>
